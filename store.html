<!doctype html>
<html>
  <head>
    <title>Store</title>
    <link rel="stylesheet" href="store.css" />
  </head>

  <body>
    <div class="nav">
      <span class="logo">SHOP</span>

      <div class="menu">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <div class="store">
      <div class="left">
        <h1>STORE</h1>
        <button>Shop now</button>
      </div>

      <div class="right">
        <img
          style="width: 250px"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Logo_FC_Bayern_M%C3%BCnchen_%282002%E2%80%932017%29.svg/3840px-Logo_FC_Bayern_M%C3%BCnchen_%282002%E2%80%932017%29.svg.png"
        />
        <h3>Linen Overshirt</h3>
        <p>$79</p>
      </div>
    </div>

    <div class="products">
      <div class="card">
        <img
          src="https://footballmonk.in/wp-content/uploads/2021/11/Bayern-third-1.jpg"
        />
        <h3>Shirt</h3>
        <p>$79</p>
        <button>Buy</button>
      </div>

      <div class="card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfJ0bY9ypAbQOHei-nKvhPex__5CbJgc0sWA&s"
        />
        <h3>Ball</h3>
        <p>$39</p>
        <button>Buy</button>
      </div>

      <div class="card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4_6akruQ3WBmTQyBYlsfFguqrecBZGg0WWA&s"
        />
        <h3>scarf</h3>
        <p>$29</p>
        <button>Buy</button>
      </div>

      <div class="card">
        <img
          src="https://img.fcbayern.com/image/upload/f_auto,q_auto,w_1280/eCommerce/produkte/34881_6"
        />
        <h3>Hoodie</h3>
        <p>$69</p>
        <button>Buy</button>
      </div>
    </div>

    <div class="footer">
      <p>SHOP</p>
    </div>
  </body>
</html>
